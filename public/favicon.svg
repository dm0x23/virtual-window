<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2e1b"/>
      <stop offset="100%" stop-color="#2a180d"/>
    </linearGradient>
    <linearGradient id="sillGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a3822"/>
      <stop offset="100%" stop-color="#211309"/>
    </linearGradient>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="8" y="7" width="48" height="48" rx="7" fill="url(#woodGrad)" stroke="#1a0f08" stroke-width="2"/>

  <!-- 4 Glass Panes (Warm Ambient View) -->
  <!-- Top-Left -->
  <rect x="12" y="11" width="18" height="18" rx="3" fill="url(#skyGrad)"/>
  <!-- Top-Right -->
  <rect x="34" y="11" width="18" height="18" rx="3" fill="url(#skyGrad)"/>
  <!-- Bottom-Left -->
  <rect x="12" y="33" width="18" height="18" rx="3" fill="url(#skyGrad)"/>
  <!-- Bottom-Right -->
  <rect x="34" y="33" width="18" height="18" rx="3" fill="url(#skyGrad)"/>

  <!-- Glass Reflections / Gleam -->
  <path d="M14 13 L24 13 L14 23 Z" fill="#ffffff" fill-opacity="0.35"/>
  <path d="M36 13 L46 13 L36 23 Z" fill="#ffffff" fill-opacity="0.35"/>

  <!-- Little Warm Sun in Top-Right Pane -->
  <circle cx="44" cy="18" r="3" fill="#fef08a" fill-opacity="0.95"/>

  <!-- Cozy Windowsill -->
  <rect x="4" y="53" width="56" height="6" rx="3" fill="url(#sillGrad)" stroke="#1a0f08" stroke-width="1.5"/>
</svg>
